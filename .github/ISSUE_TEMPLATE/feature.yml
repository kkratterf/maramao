name: "💡 Idea: una cosa nuova"
description: A feature for the timer, the menu bar or the settings.
labels: ["app"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What you want to do that Maramao does not let you do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work.
    validations:
      required: true
