name: Release

# Started by hand with the version to publish (e.g. 0.2.0).
# The version must already be set in Resources/Info.plist (CFBundleShortVersionString).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  release:
    name: Build, tag and publish
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (expected X.Y.Z)"
            exit 1
          fi

      - name: Check the version matches Info.plist
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$plist_version" != "$VERSION" ]; then
            echo "::error::Resources/Info.plist has version $plist_version, but the release asks for $VERSION. Merge a version bump first."
            exit 1
          fi

      - name: Check the tag does not exist yet
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: scripts/build-app.sh release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/Maramao-*.zip \
            --target "$GITHUB_SHA" \
            --title "Maramao $TAG" \
            --generate-notes \
            "${flags[@]}"
