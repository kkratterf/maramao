name: Release

# Runs by itself when a push to main changes the version in
# Resources/Info.plist (CFBundleShortVersionString), that is when the
# `chore(release): vX.Y.Z` bump PR is merged: if the tag vX.Y.Z does not
# exist yet, it publishes that version. A version with a suffix (0.3.0-beta.1)
# becomes a pre-release. Pushes that leave the version alone, or whose tag
# already exists, publish nothing.
#
# It can also be started by hand (workflow_dispatch) with the version to
# publish (e.g. 0.2.0), for a dry run or to retry a failed release. The
# version must already be set in Resources/Info.plist.
#
# Publishes Maramao-<version>.zip, Maramao-<version>.dmg and SHA256SUMS.txt,
# with release notes grouped by PR label (.github/release.yml), then (for
# stable releases) bumps version and sha256 in Casks/maramao.rb on main.
#
# Dry run (dry_run: true): runs the whole pipeline (checks, tests, build,
# signing, DMG, checksums, sign_update, appcast and cask edits, release notes)
# but creates no release or tag and pushes nothing to main. The zip, the DMG,
# SHA256SUMS.txt, the release notes, appcast.xml, the cask and their diffs are
# uploaded as the "maramao-<version>-dry-run" artifact, and the job summary
# shows the notes and the diffs.
#
# Signing and notarization (optional). Without these repository secrets the
# app and the DMG are signed ad-hoc, exactly as before. When ALL of them are
# set, the app is signed with a Developer ID (hardened runtime, secure
# timestamp), the zip and the DMG are notarized and the tickets stapled:
#   APPLE_DEVELOPER_ID_P12_BASE64   "Developer ID Application" certificate and
#                                   private key exported as .p12, base64-encoded
#                                   (base64 -i cert.p12 | pbcopy)
#   APPLE_DEVELOPER_ID_P12_PASSWORD password of that .p12
#   APPLE_TEAM_ID                   10-character Apple Developer Team ID
#   APPLE_NOTARY_KEY_ID             App Store Connect API key ID (Users and
#                                   Access > Integrations > Keys, role Developer)
#   APPLE_NOTARY_ISSUER_ID          issuer ID shown on the same page
#   APPLE_NOTARY_KEY_P8_BASE64      the downloaded AuthKey_<id>.p8, base64-encoded
#
# Auto-update with Sparkle (optional). When the SPARKLE_ED_PRIVATE_KEY secret
# is set, the zip is signed with Sparkle's sign_update and, for non-pre-release
# versions, added to site/appcast.xml, committed to main and deployed to
# GitHub Pages (https://kkratterf.github.io/maramao/appcast.xml). Without the
# secret these steps are skipped with a warning.
#   SPARKLE_ED_PRIVATE_KEY          private EdDSA key exported with Sparkle's
#                                   `generate_keys -x <file>`; its public half
#                                   goes in SUPublicEDKey in Resources/Info.plist
on:
  push:
    branches: [main]
    paths: [Resources/Info.plist]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build and sign everything, publish nothing (files go to the workflow artifacts)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what to publish: the inputs when started by hand, the version in
  # Info.plist on a push (skipped when its tag already exists).
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
            dry_run="$INPUT_DRY_RUN"
            publish=true
          else
            version=$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist', 'rb'))['CFBundleShortVersionString'])")
            case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
            dry_run=false
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              publish=false
              echo "::notice::v$version is already released: nothing to publish"
            else
              publish=true
              echo "::notice::Info.plist is at $version and v$version does not exist yet: publishing it"
            fi
          fi
          {
            echo "version=$version"
            echo "prerelease=${prerelease:-false}"
            echo "dry_run=${dry_run:-false}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  release:
    name: ${{ needs.plan.outputs.dry_run == 'true' && 'Dry run (publishes nothing)' || 'Build, tag and publish' }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    permissions:
      contents: write
      # To start the Pages deploy after the appcast commit (pushes made with
      # GITHUB_TOKEN do not trigger workflows on their own).
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (expected X.Y.Z)"
            exit 1
          fi

      - name: Check the version matches Info.plist
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$plist_version" != "$VERSION" ]; then
            echo "::error::Resources/Info.plist has version $plist_version, but the release asks for $VERSION. Merge a version bump first."
            exit 1
          fi

      - name: Check the tag does not exist yet
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Check for signing secrets
        id: signing
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$TEAM_ID" ] \
            && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and notarization: on"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set: the release is signed ad-hoc and not notarized"
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/maramao-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # Put the temporary keychain first in the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | grep "($TEAM_ID)" | head -n 1 \
            | sed -E 's/^.*"(.*)"$/\1/')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity for team $TEAM_ID in the certificate"
            exit 1
          fi
          echo "Signing as: $identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      # SIGN_IDENTITY is unset (ad-hoc) unless the step above ran.
      - name: Build the app bundle
        run: scripts/build-app.sh release

      - name: Notarize the app
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          zip="dist/Maramao-$VERSION.zip"
          xcrun notarytool submit "$zip" --wait --timeout 30m \
            --key "$NOTARY_KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          xcrun stapler staple dist/Maramao.app
          xcrun stapler validate dist/Maramao.app
          # Re-zip so the published zip carries the stapled ticket.
          rm -f "$zip"
          (cd dist && ditto -c -k --keepParent Maramao.app "Maramao-$VERSION.zip")
          spctl --assess --type execute --verbose dist/Maramao.app

      - name: Build the DMG
        run: scripts/build-dmg.sh

      - name: Notarize the DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg="dist/Maramao-$VERSION.dmg"
          xcrun notarytool submit "$dmg" --wait --timeout 30m \
            --key "$NOTARY_KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"

      - name: Write checksums
        working-directory: dist
        run: |
          shasum -a 256 "Maramao-$VERSION.zip" "Maramao-$VERSION.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the update for Sparkle
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: the update is not signed and the appcast is not updated"
            exit 0
          fi
          public_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Resources/Info.plist)
          if [ "$public_key" = "SPARKLE_PUBLIC_ED_KEY_PLACEHOLDER" ]; then
            echo "::warning::SUPublicEDKey in Resources/Info.plist is still the placeholder: this build hides the updater, paste the public key to turn it on"
          fi
          # Sparkle's tools come with the SwiftPM artifact; download them if
          # this SwiftPM version did not keep them.
          sign_update=$(find .build/artifacts -type f -name sign_update -perm -u+x 2>/dev/null | head -n 1)
          if [ -z "$sign_update" ]; then
            sparkle_version=$(python3 -c "import json; pins = json.load(open('Package.resolved'))['pins']; print([p['state']['version'] for p in pins if p['identity'] == 'sparkle'][0])")
            curl -fsSL -o "$RUNNER_TEMP/sparkle.zip" \
              "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-for-Swift-Package-Manager.zip"
            unzip -q -o "$RUNNER_TEMP/sparkle.zip" 'bin/*' -d "$RUNNER_TEMP/sparkle"
            sign_update="$RUNNER_TEMP/sparkle/bin/sign_update"
          fi
          echo "Using $sign_update"
          zip_signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "dist/Maramao-$VERSION.zip")
          dmg_signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "dist/Maramao-$VERSION.dmg")
          echo "zip: $zip_signature"
          echo "dmg: $dmg_signature"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "zip_signature=$zip_signature" >> "$GITHUB_OUTPUT"

      - name: Prepare the appcast and cask updates
        id: updates
        env:
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SPARKLE_ENABLED: ${{ steps.sparkle.outputs.enabled }}
          ZIP_SIGNATURE: ${{ steps.sparkle.outputs.zip_signature }}
        run: |
          # Both edits are committed on a local branch from the latest main;
          # "Push the updates to main" publishes it, except in a dry run.
          out="$RUNNER_TEMP/release-out"
          mkdir -p "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B release-updates origin/main
          base=$(git rev-parse HEAD)
          appcast=false
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::Pre-release: the appcast and the Homebrew cask keep the previous version"
          else
            if [ "$SPARKLE_ENABLED" = "true" ]; then
              mkdir -p site
              python3 scripts/update-appcast.py \
                --appcast site/appcast.xml \
                --version "$VERSION" \
                --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Maramao-$VERSION.zip" \
                --signature "$ZIP_SIGNATURE"
              git add site/appcast.xml
              git commit -m "chore(release): add Maramao $VERSION to the appcast"
              git diff HEAD~1 HEAD -- site/appcast.xml > "$out/appcast.diff"
              cp site/appcast.xml "$out/appcast.xml"
              appcast=true
            else
              echo "::notice::No Sparkle key: the appcast is not updated"
            fi
            sha=$(shasum -a 256 "dist/Maramao-$VERSION.dmg" | cut -d' ' -f1)
            sed -i '' -E \
              -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
              -e "s/^  sha256 .*$/  sha256 \"$sha\"/" \
              Casks/maramao.rb
            git add Casks/maramao.rb
            if git diff --cached --quiet; then
              echo "::notice::The Homebrew cask is already at $VERSION"
            else
              git commit -m "chore(release): bump the Homebrew cask to $VERSION"
              git diff HEAD~1 HEAD -- Casks/maramao.rb > "$out/cask.diff"
            fi
            cp Casks/maramao.rb "$out/maramao.rb"
          fi
          commits=$(git rev-list --count "$base"..HEAD)
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "appcast=$appcast" >> "$GITHUB_OUTPUT"
          git log --oneline "$base"..HEAD

      # Explicitly from .github/release.yml, so the notes are grouped by PR label.
      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f configuration_file_path=.github/release.yml \
            --jq .body > "$RUNNER_TEMP/release-out/release-notes.md"
          cat "$RUNNER_TEMP/release-out/release-notes.md"

      - name: Create the release
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            "dist/Maramao-$VERSION.zip" \
            "dist/Maramao-$VERSION.dmg" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Maramao $TAG" \
            --notes-file "$RUNNER_TEMP/release-out/release-notes.md" \
            "${flags[@]}"

      # After the release, so the appcast and the cask never point at missing assets.
      - name: Push the updates to main
        if: needs.plan.outputs.dry_run != 'true' && steps.updates.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          APPCAST: ${{ steps.updates.outputs.appcast }}
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Could not push the appcast and cask updates to main"; exit 1; fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
          if [ "$APPCAST" = "true" ] && ! gh workflow run pages.yml --ref main; then
            echo "::warning::Could not start the Pages deploy: run the Pages workflow by hand to publish appcast.xml"
          fi

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          out="$RUNNER_TEMP/release-out"
          fence='```'
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Maramao $TAG: dry run"
              echo
              echo "Nothing was published: no GitHub release, no tag, no commits to main. The files are in the workflow artifacts."
            else
              echo "## Maramao $TAG"
            fi
            echo
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "### SHA256SUMS.txt"
              echo "$fence"; cat dist/SHA256SUMS.txt; echo "$fence"
            fi
            if [ -f "$out/release-notes.md" ]; then
              echo "### Release notes"
              echo
              cat "$out/release-notes.md"
              echo
            fi
            for name in appcast cask; do
              echo "### ${name} diff"
              if [ -s "$out/$name.diff" ]; then
                echo "${fence}diff"; cat "$out/$name.diff"; echo "$fence"
              else
                echo "_No change._"
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the dry-run files
        if: always() && needs.plan.outputs.dry_run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release-out"
          cp dist/Maramao-*.zip dist/Maramao-*.dmg dist/SHA256SUMS.txt "$RUNNER_TEMP/release-out/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/release-out"

      - name: Upload the dry-run files
        if: always() && needs.plan.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maramao-${{ needs.plan.outputs.version }}-dry-run
          path: ${{ runner.temp }}/release-out/
          if-no-files-found: warn
          retention-days: 14
