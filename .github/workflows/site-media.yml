name: Site media (temporary)

on:
  push:
    branches: [claude/project-thread-fbcf13]
    paths: [".media/*.txt", ".media/*.py", ".github/workflows/site-media.yml"]

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow
      - name: Contact sheets
        if: hashFiles('.media/pick.txt') == ''
        run: python3 .media/preview.py
      - name: Fetch and encode
        if: hashFiles('.media/pick.txt') != ''
        run: python3 .media/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A .media; if [ -d site/media ]; then git add -A site/media; fi
          git commit -m "chore: site media output" && git push
