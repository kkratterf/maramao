name: Site media (temporary)

on:
  push:
    branches: [claude/project-thread-fbcf13]
    paths: [".media/**", ".github/workflows/site-media.yml"]

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover
        if: hashFiles('.media/pick.txt') == ''
        run: python3 .media/discover.py
      - name: Commit the report
        if: hashFiles('.media/pick.txt') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add .media/report.txt
          git commit -m "chore: cat media report" && git push
