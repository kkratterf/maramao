name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: scripts/build-app.sh release

      - name: Check the app bundle
        run: |
          app=dist/Maramao.app
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          otool -L "$app/Contents/MacOS/Maramao" | grep Sparkle
          otool -l "$app/Contents/MacOS/Maramao" | grep -A2 LC_RPATH
          lipo -archs "$app/Contents/MacOS/Maramao"
          codesign --verify --deep --strict --verbose=1 "$app"
          # Smoke test: dyld must find Sparkle, and the app must stay up.
          "$app/Contents/MacOS/Maramao" &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "::error::Maramao.app exited at launch"
            exit 1
          fi
          kill "$pid"
          echo "Maramao.app launched and stayed up"
          echo "::notice::Maramao.app $(lipo -archs "$app/Contents/MacOS/Maramao"), bundle $(du -sk "$app" | cut -f1) KB, Sparkle.framework $(du -sk "$app/Contents/Frameworks/Sparkle.framework" | cut -f1) KB"

      - name: Check the Shortcuts actions metadata
        run: |
          data=dist/Maramao.app/Contents/Resources/Metadata.appintents/extract.actionsdata
          [ -f "$data" ] || { echo "::error::Metadata.appintents missing from the app bundle (see the build-app.sh output)"; exit 1; }
          for intent in StartFocusIntent PauseIntent TakeBreakIntent SetBreakModeIntent GetStatusIntent; do
            grep -q "\"$intent\"" "$data" || { echo "::error::$intent missing from Metadata.appintents"; exit 1; }
          done
          echo "Metadata.appintents OK ($(wc -c < "$data" | tr -d ' ') bytes)"

      - name: Check the translations in the app bundle
        run: |
          app=dist/Maramao.app
          res="$app/Contents/Resources"
          ls -la "$res"
          plutil -convert json -o - "$res/en.lproj/Localizable.strings" | grep -q "Start working"
          # Runs the app with each language; MARAMAO_L10N_PROBE prints a few strings and quits.
          probe() {
            MARAMAO_L10N_PROBE=1 "$app/Contents/MacOS/Maramao" -AppleLanguages "($1)" > "probe-$1.txt" 2>/dev/null &
            pid=$!
            for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
            kill "$pid" 2>/dev/null || true
            echo "--- $1"; cat "probe-$1.txt"
          }
          probe en
          probe it
          status=0
          for want in "Start working" "1 pomodoro" "4 pomodoros" "Cat on your window"; do
            grep -qxF "$want" probe-en.txt || { echo "::error::English string missing at runtime: $want"; status=1; }
          done
          for want in "Inizia a lavorare" "1 pomodoro" "4 pomodori" "Il gatto sulla finestra"; do
            grep -qxF "$want" probe-it.txt || { echo "::error::Italian string missing at runtime: $want"; status=1; }
          done
          exit $status

      - name: Check the App Intents metadata
        run: |
          meta=dist/Maramao.app/Contents/Resources/Metadata.appintents
          if [ ! -f "$meta/extract.actionsdata" ]; then
            echo "::error::Metadata.appintents is missing from Maramao.app: the Focus filter would not show up"
            exit 1
          fi
          grep -q "MaramaoFocusFilter" "$meta/extract.actionsdata" \
            || { echo "::error::the Focus filter intent is missing from Metadata.appintents"; exit 1; }
          echo "::notice::Metadata.appintents: $(ls "$meta" | tr '\n' ' ')($(wc -c < "$meta/extract.actionsdata" | tr -d ' ') bytes of actions data)"

      - name: Upload Maramao.app
        uses: actions/upload-artifact@v4
        with:
          name: Maramao-app
          path: dist/*.zip
          retention-days: 14

      - name: Build the DMG
        run: scripts/build-dmg.sh

      - name: Check the DMG
        run: |
          dmg=$(ls dist/Maramao-*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -noverify -mountpoint "$mnt" "$dmg" >/dev/null
          ls -la "$mnt"
          status=0
          [ -d "$mnt/Maramao.app" ] || { echo "::error::Maramao.app missing from the DMG"; status=1; }
          [ -L "$mnt/Applications" ] || { echo "::error::Applications link missing from the DMG"; status=1; }
          [ -f "$mnt/.background/background.tiff" ] || echo "::warning::no background in the DMG"
          [ -f "$mnt/.DS_Store" ] || echo "::warning::no Finder layout (.DS_Store) in the DMG"
          codesign --verify --verbose=1 "$mnt/Maramao.app" || status=1
          hdiutil detach "$mnt" -quiet || hdiutil detach "$mnt" -force
          exit $status

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Maramao-dmg
          path: dist/*.dmg
          retention-days: 14

  shellcheck:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --shell=sh install.sh
          sh -n install.sh

      - name: String Catalog
        run: python3 scripts/check-strings.py

      - name: Appcast script
        run: |
          tmp=$(mktemp -d)
          python3 scripts/update-appcast.py --appcast "$tmp/appcast.xml" --version 0.2.0 \
            --url https://example.com/Maramao-0.2.0.zip --signature 'sparkle:edSignature="AAAA" length="10"'
          python3 scripts/update-appcast.py --appcast "$tmp/appcast.xml" --version 0.3.0 \
            --url https://example.com/Maramao-0.3.0.zip --signature 'sparkle:edSignature="BBBB" length="20"'
          cat "$tmp/appcast.xml"
          test "$(grep -c '<item>' "$tmp/appcast.xml")" = 2

  cask:
    name: Homebrew cask
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: brew style
        run: brew style Casks/maramao.rb

      # The audit runs offline (no --online, no --new): those checks download
      # the DMG and query GitHub for notability, and the version in the cask may
      # point at a release that has no DMG yet (it is bumped by release.yml).
      - name: brew audit
        run: |
          brew tap-new --no-git maramao/ci
          tap="$(brew --repository)/Library/Taps/maramao/homebrew-ci"
          mkdir -p "$tap/Casks"
          cp Casks/maramao.rb "$tap/Casks/maramao.rb"
          if ! brew audit --cask --strict maramao/ci/maramao > audit.log 2>&1; then
            cat audit.log
            # Surface the findings as annotations, so they show on the PR.
            grep -v '^$' audit.log | while IFS= read -r line; do echo "::error file=Casks/maramao.rb::$line"; done
            exit 1
          fi
          cat audit.log
