name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: scripts/build-app.sh release

      - name: Upload Maramao.app
        uses: actions/upload-artifact@v4
        with:
          name: Maramao-app
          path: dist/*.zip
          retention-days: 14
