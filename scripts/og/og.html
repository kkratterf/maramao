<!doctype html>
<!-- Social preview card (og.jpg, og-it.jpg), rendered by scripts/render-og.mjs.
     #it switches the copy to Italian. DM Serif Display is by Colophon Foundry, SIL Open Font License 1.1. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DM Serif Display"; font-weight: 400; src: url(dm-serif-display-400.woff2) format("woff2"); }
  @font-face { font-family: "DM Serif Display"; font-weight: 400; font-style: italic; src: url(dm-serif-display-400-italic.woff2) format("woff2"); }
  html, body { margin: 0; background: #08080a; }
  #card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: Inter, -apple-system, system-ui, sans-serif; color: #f4f4f5; }
  .grainient, .grainient canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(8 8 10 / 72%) 0%, rgb(8 8 10 / 35%) 55%, rgb(8 8 10 / 0%) 100%); }
  .copy { position: absolute; left: 80px; top: 72px; bottom: 72px; width: 640px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: "DM Serif Display", serif; font-weight: 400; font-size: 40px; letter-spacing: -0.01em; }
  .brand img { width: 60px; height: 60px; border-radius: 15px; }
  h1 { margin: auto 0 0; font-family: "DM Serif Display", serif; font-weight: 400; font-size: 66px; line-height: 1.04; letter-spacing: -0.02em; }
  h1 span { display: block; font-style: italic; color: #ff8a91; }
  p { margin: 28px 0 0; font-weight: 500; font-size: 27px; color: rgb(244 244 245 / 72%); letter-spacing: -0.01em; }
  .cat { position: absolute; right: 76px; top: 50%; width: 370px; height: 370px; transform: translateY(-50%) rotate(3deg);
         border-radius: 86px; overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / 45%), 0 0 0 1px rgb(255 255 255 / 14%); }
  .cat img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="card">
  <div class="grainient" data-grainient data-colors="#0a0808,#1f0507,#7a0a12,#e8202e,#ff4552" data-angle="20" data-speed="0.8" data-flow="0.9" data-silk="0.3" data-grain-amount="0.03" data-dpr="1"><canvas></canvas></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="brand"><img src="../../Resources/logo/logo.png" alt=""> Maramao</div>
    <h1 data-en="Work for 25 minutes<span>Then the cat takes over</span>" data-it="Lavori 25 minuti<span>Poi arriva il gatto</span>"></h1>
    <p data-en="Free Pomodoro timer for the Mac menu bar" data-it="Il timer Pomodoro gratuito per il Mac"></p>
  </div>
  <div class="cat"><img src="../../Resources/logo/logo.png" alt=""></div>
</div>
<script>
  const lang = location.hash === '#it' ? 'it' : 'en';
  for (const el of document.querySelectorAll('[data-en]')) el.innerHTML = el.dataset[lang];
</script>
<script src="../../site/grainient.js"></script>
</body>
</html>
